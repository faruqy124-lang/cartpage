<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="product.css" />
    <title>Arry</title>
  </head>

  <body>
    <container class="container">
        <section id="section">
      <div id="grid_display">
        <div
          style="
            font-size: 20px;
            /* font-family: roboto; */
            font-weight: 700;
            text-transform: capitalize;
            padding: 30px 20px;
          "
        >
          Enter your items.
        </div>
        <div id="input_display">
          <input
            id="prodMail"
            type="text"
            placeholder="Product Name"
            autofocus
          />
          <input
            id="prodPrice"
            type="text"
            placeholder="Product Price"
            autofocus
          />
          <input
            id="prodQuantity"
            type="text"
            placeholder="Product quantity"
            autofocus
          />
          <input
            id="proImage"
            type="text"
            placeholder="Product Image"
            autofocus
          />
        </div>
        <div id="display_button">
          <button id="button_submit" onclick="submit()">Submit Product</button>
          <button id="button_submit" onclick="deleteALL()">clear all</button>
          <button id="button_submit" onclick="removeFrist()">
            Delet first
          </button>
          <button id="button_submit" onclick="addFirst()">Add as first</button>
          <button id="button_submit" onclick="Reverse()">Reverse item</button>
          <button id="button_submit" onclick="removeLast()">Remove last</button>
        </div>

        <!-- <br /> -->
      </div>
      <div class="prodDisplay" >
        <div
          style="
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-transform: capitalize;
            font-weight: 600;
            width: 100%;
          "
          id="title"
        ></div>
        <div
          id="scroll"
          style="
            overflow-y: auto;
            margin-top: 5px;
            flex: 1;
            min-height: 0;
            padding-right: 5px;
          "
        >
          <div
            style="display: flex;flex: 1; flex-direction: column; gap: 20px"
            id="result"
          >
            <!-- item input -->
          </div>
        </div>
      </div>
      <div
        id="message_pop"
        style="
          position: fixed;
          background: rgba(0, 0, 0, 0.3);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          width: 100%;
          height: 100vh;
          top: 0;
          right: 0;
          left: 0;
          bottom: 0;
          align-items: center;
          justify-content: center;
          display: none;
          z-index: 100;
        "
      >
        <div id="message">n</div>
      </div>
    </section>
    </container>
  
    <!--na cancel dey there-->
    <div
      class="cancel"
      style="
        position: fixed;
        z-index: 1000;
        inset: 0;
        background: rgba(0, 0, 0, 0.3);
        backdrop-filter: blur(2px);
        display: none;
        align-items: center;
        justify-content: center;
      "
    >
      <div
        style="
          background: #f2f7fc;
          width: 700px;
          display: flex;
          flex-direction: column;
          border-radius: 10px;
          height: 150px;
          justify-content: center;
          position: relative;
        "
      >
        <input
          class="input_items"
          type="text"
          autofocus
          style="
            height: 50px;
            margin: 0 20px;
            border-radius: 5px;
            border: 1px solid;
            margin-top: 10px;
            padding: 0 10px;
          "
        />
        <div
          id="button_section"
          style="
            padding-top: 10px;
            display: flex;
            justify-content: end;
            margin-right: 025px;
          "
        >
          <button onclick="cancels()">cancel</button>
          <button onclick="saveEdit()" class="edit">save</button>
        </div>
        <p
          style="
            position: absolute;
            top: 0px;
            left: 15px;
            font-size: 17px;
            display: flex;
            /* font-family: roboto; */
            text-transform: capitalize;
            font-weight: 500;
          "
        >
          edit item
        </p>
        <p
          onclick="cancels()"
          style="
            position: absolute;
            right: 15px;
            top: 0;
            font-size: 25px;
            display: flex;
            cursor: pointer;
            justify-content: space-between;
          "
        >
          &times;
        </p>
      </div>
    </div>

    <script>
      let product = [];
      let editProduct = null;
      let prodobject = null;
      let cart = [];

      function saveToLocalStorage() {
        // localStorage.setItem("products", JSON.stringify(product))
        localStorage.setItem("products", JSON.stringify(product));
        localStorage.setItem("cart", JSON.stringify(cart));
      }

      function loadFromLocalStorage() {
        const saved = localStorage.getItem("products");
        const saveCart = localStorage.getItem("cart");
        if (saved) {
          product = JSON.parse(saved);
        } else {
          product = [];
        }
        if (saveCart) {
          cart = JSON.parse(saveCart);
        } else {
          cart = [];
        }
        displayProd();
      }

      loadFromLocalStorage();

      function submit() {
        const productName = document.getElementById("prodMail").value.trim();
        const productQuantity = document
          .getElementById("prodQuantity")
          .value.trim();
        const productPrice = document.getElementById("prodPrice").value.trim();
        const prodImage = document.getElementById("proImage").value;

        if (productName === "") {
          alert("input product name");
          return;
        }

        prodobject = {
          productName: productName,
          proQuantity: productQuantity || 0,
          productPrice: productPrice || 0,
          prodImage: prodImage,
        };

        product.push(prodobject);
        console.log(product);
        console.log(prodobject.productName);
        console.log(prodobject);
        console.log(product.length);

        saveToLocalStorage();
        displayProd();
        clearInput();
      }
      function clearInput() {
        document.getElementById("prodMail").value = "";
        document.getElementById("prodQuantity").value = "";
        document.getElementById("prodPrice").value = "";
        document.getElementById("proImage").value = "";
      }

      function displayProd() {
        result.innerHTML = "";
        for (let i = 0; i < product.length; i++) {
          const item = product[i];
          result.innerHTML += `<div id="results">
            <div class="product_img">
              <img src="${item.prodImage}" alt="">
            </div>
            <div id="productInfo">
             <div class="product_name">
              ${item.productName}
              </div>
            <div class="product_name"   style="
              color:gray;
              font-size:14px" >
              $${item.proQuantity}
            </div>
            <div class="product_name"  style="
              color:gray;">
              ${item.productPrice}
            </div>
            </div>
           <div class="button_section_setting">
                <button class="translate add_to_cart" onclick="changeText(this, ${i});">add to cart</button>
            <div id="button_section">
                <button onclick="eidtInput(${i});  cancels()" id="button_submit" class="edit translate"  style="
                  background:#F0F0F0;
                  color:black;
                  border:1PX solid gray;
                  cursor:pointer" > edit </button>
                <button id="button_submit" class="translate"
                  style="
                  background:red;
                  color:white;
                  cursor:pointer"
                onclick="deleteItems();"> delete</button>
                </div>
              </div>
            </div>`;
        }
        productLength();
      }

      function eidtInput(index) {
        editProduct = index;
        const input = document.querySelector(".input_items");
        input.value = product[index].productName;

        input.focus();
        input.select();
        console.log(product);
        console.log(input);
        saveToLocalStorage();
      }
      //  eidtInput()

      function productLength() {
        if (product.length === 0) {
          result.innerHTML = `<div class ="items"> <p class="item_notification"> no product added </p><div>`;
          title.innerHTML = "";
        } else {
          title.innerHTML = `
           <div class = "title_setting">
              <p>Product Name</p>
              <div>
               <input type="text" placeholder="find items" onKeyUp ="searchedFruits();">
               <button> search </button>
               <div class="cart">
                  <img src="./discount.jpg" alt="">
                  <div id="cartLength" > 0</div>
                </div>
              </div>
            </div>`;
        }
      }
      productLength();
      function changeText(button, index) {
        const item = product[index];
        const cartIndex = cart.findIndex((cartItem) => cartItem.id === index);

        if (cartIndex === -1) {
          // Add to cart
          cart.push({
            id: index,
            productName: item.productName,
            proQuantity: item.proQuantity,
            productPrice: item.productPrice,
            prodImage: item.prodImage,
            quantity: 1, // Default quantity
          });
          button.innerHTML = "added to cart";
          button.style.backgroundColor = "#28a745";
          button.style.color = "white";

          message(index);
        } else {
          // Remove from cart
          cart.splice(cartIndex, 1);
          button.innerHTML = "add to cart";
          button.style.backgroundColor = "";
          button.style.color = "";
        }

        localStorage.setItem("count", cart.length);
        console.log(cart);
        console.log(item.productName);

        console.log(cart.length);
        saveToLocalStorage();
        count();
      }

      function message(index) {
        const item = product[index];
        const messageOutPut = document.getElementById("message");
        if (item) {
          messageOutPut.innerHTML = `
           <div class="pop_image">
            <img src="./congratulations.jpg" alt="image" />
            </div>
            <div style =
             "display:flex;
              align-items:center;
              justify-content:center;
              flex-direction:column">
              <p style="font-weight:600"> ADDED TO Cart</p>
              <p style="margin:10px;
              text-transform:capitalize;
              font-size:16px;
              color:gray;
              font-family:"Inter" san-serif;
              > ${item.productName} was succesfully add to cart </p>
              <button style="margin:10px;padding:10px 20px;border-radius:10px;border:1px solid gray;font-size:16px;font-weight:600;cursor:pointer" onclick ="display()"> Contiune Shopping </button>
        <div>

        <div>`;
        }
        display();
      }
      function display() {
        const messagepop = document.getElementById("message_pop");

        if (messagepop.style.display === "none") {
          messagepop.style.display = "flex";
        } else {
          messagepop.style.display = "none";
        }
      }
      function count() {
        const count = localStorage.getItem("count" || 0);
        document.getElementById("cartLength").innerHTML = count || 0;
        console.log(count);
      }
      count();

      function removeLast() {
        product.pop(); // delet las
        displayProd();
        saveToLocalStorage();
      }
      function removeFrist() {
        product.shift();
        displayProd();
        saveToLocalStorage();
      }
      function addFirst() {
        const productName = document.getElementById("prodMail").value.trim();
        const productQuantity = document
          .getElementById("prodQuantity")
          .value.trim();
        const productPrice = document.getElementById("prodPrice").value.trim();
        const prodImage = document.getElementById("proImage").value;

        if (productName === "") {
          alert("Please enter a product name in the form above");
          return;
        }

        prodobject = {
          productName: productName,
          proQuantity: productQuantity || 0,
          productPrice: productPrice || 0,
          prodImage: prodImage,
        };
        if (prodobject) {
          product.unshift(prodobject);
          displayProd();
        }
        saveToLocalStorage();

        clearInput();
      }
      function Reverse() {
        product.reverse();
        saveToLocalStorage();
        displayProd();
      }
      function deleteALL() {
        product = [];
        saveToLocalStorage();
        displayProd();
      }
      function cancels() {
        const cancel = document.querySelector(".cancel");
        if (cancel.style.display === "flex") {
          cancel.style.display = "none";
        } else {
          cancel.style.display = "flex";
        }
      }
      function saveEdit() {
        const input = document.querySelector(".input_items");

        const newValue = input.value.trim();
        if (newValue === "" || newValue === null) {
          alert("Enter the correct item name");
          return;
        }
        product[editProduct].productName = newValue;
        displayProd();
        saveToLocalStorage();

        cancels();
      }

      function deleteItems(index) {
        product.splice(index, 1);
        saveToLocalStorage();
        displayProd();
        console.log(product);
      }

      function searchedFruits() {
        const searchInput = document.querySelector(".title_setting input");
        const searchTerm = searchInput.value.trim().toLowerCase();

        // If search is empty, show all products
        if (searchTerm === "") {
          displayProd();
          return;
        }

        // Filter products
        const filteredProducts = product.filter((item) =>
          item.productName.toLowerCase().includes(searchTerm),
        );

        // Clear results container
        result.innerHTML = "";

        if (filteredProducts.length === 0) {
          // Show no results message
          result.innerHTML = `
            <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:300px; gap:10px;flex:1;">
                <div style="font-size:48px;">🔍</div>
                <p style="font-size:20px; font-weight:600; color:#1a1a2e;">No products found</p>
                <p style="font-size:14px; color:#94a3b8;">We couldn't find any products matching "${searchTerm}"</p>
                <button onclick="clearSearch()" style="padding:10px 24px; border-radius:8px; border:1px solid #e1e5ec; background:white; cursor:pointer; font-weight:600; margin-top:10px;">
                    Clear Search
                </button>
            </div>
        `;
          return;
        }

        // Show filtered results with a counter
        result.innerHTML = `
        <div style="padding:8px 0 12px 0; color:#64748b; font-size:14px;">
            Found ${filteredProducts.length} product${filteredProducts.length > 1 ? "s" : ""}
        </div>
    `;

        // Display each filtered product
        filteredProducts.forEach((item) => {
          const originalIndex = product.indexOf(item);

          result.innerHTML += `<div id="results">
            <div class="product_img">
                <img src="${item.prodImage || "https://via.placeholder.com/90"}" alt="${item.productName}">
            </div>
            <div class="product_name">
                ${item.productName}
            </div>
            <div class="product_name" style="color:gray; font-size:14px">
                $${item.proQuantity}
            </div>
            <div class="product_name" style="color:gray;">
                $${item.productPrice}
            </div>
            <div class="button_section_setting">
                <button class="translate add_to_cart" onclick="changeText(this, ${originalIndex});">add to cart</button>
                <div id="button_section">
                    <button onclick="eidtInput(${originalIndex}); cancels()" id="button_submit" class="edit translate" style="background:#F0F0F0; color:black; border:1PX solid gray; cursor:pointer">edit</button>
                    <button id="button_submit" class="translate" style="background:red; color:white; cursor:pointer" onclick="deleteItems(${originalIndex});">delete</button>
                </div>
            </div>
        </div>`;
        });
      }

      // Function to clear search
      function clearSearch() {
        const searchInput = document.querySelector(".title_setting input");
        if (searchInput) {
          searchInput.value = "";
          displayProd();
        }
      }
    </script>
  </body>
</html>
